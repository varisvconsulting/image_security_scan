name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    # Don't publish images from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # this step is needed because otherwise build fails. 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker_site
          push: false
          outputs: type=docker,dest=/tmp/image.tar 
          tags: |
            ${{ github.repository }}:${{ github.sha }}
          # old:
          #   ghcr.io/${{ github.repository }}:${{ github.sha }}
          #   ghcr.io/${{ github.repository }}:latest
      
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
            
      
  trivy-test:
    name: run Trivy test
    runs-on: ubuntu-latest
    needs: build
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: trivy - scan dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ./docker_site
          severity: CRITICAL,HIGH
          exit-code: '1'

      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: trivy - scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ github.repository }}:${{ github.sha }}'
          format: 'table'
          version: v0.74.0
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  grype-test:
    name: run Grype test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Scan image
        uses: anchore/scan-action@v7
        with:
          image: '${{ github.repository }}:${{ github.sha }}'
          fail-build: false
          severity-cutoff: medium
          output-format: table  

  syft-scan:
    name: run Syft scan of image
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: syft scan
        uses: anchore/sbom-action@v0
        with:
          image: '${{ github.repository }}:${{ github.sha }}'
          id: 'sbom-${{ github.run_number }}'
          output-file: 'sbom.spdx.json'

      - name: print sbom
        run: |
          cat sbom.spdx.json

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  publish:
    name: Push image
    needs: 
      - syft-scan
      - grype-test
      - trivy-test

    runs-on: ubuntu-latest


    outputs:
      digest: ${{ steps.push.outputs.digest }}

    permissions:
      contents: read
      packages: write 

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        run: |
          docker tag \
            ${{ github.repository }}:${{ github.sha }} \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

          docker tag \
            ${{ github.repository }}:${{ github.sha }} \
            ghcr.io/${{ github.repository }}:latest

      - name: Push image
        id: push
        run: |
          OUTPUT=$(docker push ghcr.io/${{ github.repository }}:${{ github.sha }} 2>&1)
          echo "$OUTPUT"
          DIGEST=$(echo "$OUTPUT" | grep -oE 'digest: sha256:[a-f0-9]{64}' | head -1 | cut -d' ' -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          docker push ghcr.io/${{ github.repository }}:latest

  attest-sbom:
    name: attest SBOM, provenance, and signing
    runs-on: ubuntu-latest
    needs: 
      - publish
    
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@main
        with:
          cosign-release: v3.0.2

      - name: Sign image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"